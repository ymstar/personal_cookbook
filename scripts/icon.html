<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e0532f;
  }
  .icon {
    width: 512px;
    height: 512px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Bowl */
  .bowl {
    width: 280px;
    height: 140px;
    background: #faf6f1;
    border-radius: 0 0 140px 140px;
    position: relative;
    z-index: 2;
    box-shadow: 0 8px 0 rgba(0,0,0,0.08);
  }
  /* Bowl rim */
  .bowl::before {
    content: '';
    position: absolute;
    top: -12px;
    left: -8px;
    right: -8px;
    height: 24px;
    background: #faf6f1;
    border-radius: 50%;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.06);
  }
  /* Food in bowl */
  .food {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 30px;
    background: #f5c945;
    border-radius: 50%;
    z-index: 3;
  }
  .food::before {
    content: '';
    position: absolute;
    top: 4px;
    left: 40px;
    width: 50px;
    height: 16px;
    background: #e0532f;
    border-radius: 50%;
    opacity: 0.85;
  }
  .food::after {
    content: '';
    position: absolute;
    top: 6px;
    right: 50px;
    width: 40px;
    height: 14px;
    background: #5cbb7e;
    border-radius: 50%;
    opacity: 0.85;
  }
  /* Chopsticks */
  .chopstick-1 {
    position: absolute;
    width: 10px;
    height: 260px;
    background: #d4a868;
    border-radius: 5px;
    transform: rotate(18deg);
    top: 60px;
    left: 300px;
    z-index: 4;
    box-shadow: 2px 0 0 rgba(0,0,0,0.1);
  }
  .chopstick-2 {
    position: absolute;
    width: 10px;
    height: 260px;
    background: #d4a868;
    border-radius: 5px;
    transform: rotate(26deg);
    top: 55px;
    left: 322px;
    z-index: 4;
    box-shadow: 2px 0 0 rgba(0,0,0,0.1);
  }
  /* Steam */
  .steam {
    position: absolute;
    bottom: 200px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
  }
  .steam span {
    display: inline-block;
    width: 16px;
    height: 16px;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
    margin: 0 10px;
    animation: rise 2s infinite ease-in-out;
  }
  .steam span:nth-child(2) { animation-delay: 0.3s; }
  .steam span:nth-child(3) { animation-delay: 0.6s; }
  @keyframes rise {
    0%, 100% { transform: translateY(0); opacity: 0.35; }
    50% { transform: translateY(-20px); opacity: 0.1; }
  }
</style>
</head>
<body>
<div class="icon">
  <div class="steam"><span></span><span></span><span></span></div>
  <div class="bowl"><div class="food"></div></div>
  <div class="chopstick-1"></div>
  <div class="chopstick-2"></div>
</div>
</body>
</html>
